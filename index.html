<!doctype html>
<!-- Tiletopia build 1.0.0 -->
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tiletopia</title>
  <meta name="description" content="Tiletopia — tropical triple-tile matching puzzle. Works offline, no data collected.">
  <meta name="theme-color" content="#2ec4b6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiletopia">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" type="image/png" sizes="180x180" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
/* Tiletopia — game styles (mobile-first, iOS safe-area aware) */

:root {
  --wood: #c98a4b;
  --wood-dark: #a96f38;
  --cream: #fff6e5;
  --cream-2: #ffedc9;
  --sun: #ffd23f;
  --sun-dark: #b87712;
  --teal: #2ec4b6;
  --teal-dark: #21867a;
  --coral: #ff5f6d;
  --orange: #ff8f5e;
  --ink: #5c3a1e;
  --ink-soft: #7a4a21;
  --white: #ffffff;
  --radius: 18px;
  --shadow: 0 10px 24px rgba(42, 84, 66, 0.35);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--teal);
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  position: fixed;
  width: 100%;
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
}

#game-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  touch-action: none;
}

#ui-root {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  pointer-events: none;
}

.scene {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  pointer-events: auto;
  padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}
.scene--active { display: flex; }

/* ---------- generic controls ---------- */
.btn {
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 800;
  letter-spacing: 0.06em;
  border-radius: 999px;
  padding: 16px 22px;
  font-size: clamp(15px, 4.2vw, 19px);
  min-height: 54px;
  transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.14), 0 10px 22px rgba(42, 84, 66, 0.28);
}
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.14); }
.btn img { width: 1.2em; height: 1.2em; }
.btn--primary { background: linear-gradient(180deg, #ffb42e, #f59f1b); color: #6b3b10; }
.btn--secondary { background: linear-gradient(180deg, #2ec4b6, #26a89c); color: #06332e; }
.btn--ghost { background: rgba(255, 246, 229, 0.92); color: var(--ink-soft); box-shadow: 0 4px 0 rgba(120, 84, 40, 0.18); }
.btn--rewarded { background: linear-gradient(180deg, #ff8f5e, #f2603a); color: #fff; }
.btn--adclose { background: rgba(0,0,0,0.55); color: #fff; font-size: 15px; min-height: 44px; padding: 10px 18px; }
.btn[disabled] { opacity: 0.45; cursor: default; }

.iconbtn {
  border: none; cursor: pointer;
  background: rgba(255, 246, 229, 0.92);
  border-radius: 14px;
  padding: 8px;
  width: 48px; height: 48px;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 0 rgba(120, 84, 40, 0.18);
}
.iconbtn img { width: 28px; height: 28px; }
.iconbtn:active { transform: translateY(2px); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255, 246, 229, 0.92);
  border-radius: 999px;
  padding: 6px 14px;
  font-weight: 800;
  color: var(--ink-soft);
  font-size: 14px;
}
.chip img { width: 20px; height: 20px; }

.bar {
  width: 100%;
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 8px;
  position: sticky; top: 0; z-index: 3;
}
.bar h2 { font-size: clamp(18px, 5vw, 24px); color: var(--cream); text-shadow: 0 2px 8px rgba(0,0,0,0.25); flex: 1; }

/* ---------- menu ---------- */
.scene--menu { justify-content: space-between; background: linear-gradient(180deg, #2ec4b6 0%, #7fe3d0 55%, #ffe9b8 100%); }
.menu__sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.menu__logo { text-align: center; margin-top: 8vh; position: relative; }
.menu__koko {
  width: clamp(140px, 34vw, 220px);
  height: auto;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.25));
  animation: bob 3.2s ease-in-out infinite;
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.menu__title {
  font-size: clamp(40px, 11vw, 64px);
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.08em;
  text-shadow: 0 4px 0 #2a9d8f, 0 10px 24px rgba(0,0,0,0.35);
  margin-top: 6px;
}
.menu__tag { color: #f4fbf9; font-weight: 700; letter-spacing: 0.04em; margin-top: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.menu__actions { display: flex; flex-direction: column; gap: 12px; width: min(92vw, 340px); position: relative; }
.menu__row { display: flex; gap: 12px; }
.btn--half { flex: 1; }
.menu__footer { display: flex; gap: 10px; position: relative; padding-bottom: 2vh; }

/* ---------- levels grid ---------- */
.scene--levels { background: linear-gradient(180deg, #2ec4b6, #7fe3d0 70%, #ffe9b8); }
.levels__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 12px;
  width: 100%;
  max-width: 520px;
  padding-bottom: 24px;
}
.lvl {
  border: none; cursor: pointer;
  background: linear-gradient(180deg, var(--cream), var(--cream-2));
  border-radius: 16px;
  aspect-ratio: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  box-shadow: 0 5px 0 rgba(120, 84, 40, 0.25);
  font-family: inherit;
  transition: transform 0.08s ease;
}
.lvl:active { transform: translateY(3px); }
.lvl__num { font-size: clamp(18px, 5vw, 24px); font-weight: 900; color: var(--ink-soft); }
.lvl__stars img { width: 16px; height: 16px; }
.lvl--locked { opacity: 0.5; filter: grayscale(0.7); box-shadow: none; border: 2px dashed rgba(90,55,22,0.35); }

/* ---------- settings / about ---------- */
.scene--settings, .scene--about { background: linear-gradient(180deg, #2ec4b6, #7fe3d0 70%, #ffe9b8); }
.settings__list { width: min(94vw, 420px); display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }
.setting {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: rgba(255, 246, 229, 0.94);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-weight: 700;
  color: var(--ink);
  box-shadow: 0 4px 0 rgba(120, 84, 40, 0.15);
  flex-wrap: wrap;
}
.setting--info b { color: var(--ink-soft); font-size: 14px; max-width: 60%; text-align: right; }
.toggle {
  border: none; cursor: pointer;
  width: 58px; height: 32px;
  border-radius: 999px;
  background: #d8c9a8;
  position: relative;
  transition: background 0.2s ease;
  flex-shrink: 0;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 26px; height: 26px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  transition: left 0.2s ease;
}
.toggle[aria-pressed="true"] { background: #3bc9a4; }
.toggle[aria-pressed="true"]::after { left: 29px; }
.langrow { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  border: 2px solid rgba(122, 74, 33, 0.25);
  background: var(--cream);
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 7px 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
}
.pill--on { background: var(--sun); border-color: var(--sun-dark); }
.about__body { width: min(94vw, 420px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 24px; }
.about__koko { width: clamp(120px, 30vw, 180px); }
.about__body p { font-size: 15px; line-height: 1.6; color: #243c36; }
.about__fine { font-size: 12.5px; color: #47625a; }

/* ---------- game HUD ---------- */
.scene--game { pointer-events: none; overflow: hidden; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud__top {
  position: absolute; top: 8px; left: 12px; right: 12px;
  display: flex; align-items: center; gap: 10px;
}
.hud__top .iconbtn { pointer-events: auto; }
.hud__level {
  flex: 1;
  text-align: center;
  display: flex; align-items: baseline; justify-content: center; gap: 6px;
  color: #fff; font-weight: 900;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.hud__level b { font-size: clamp(20px, 6vw, 26px); }
.hud__level-label { font-size: 12px; letter-spacing: 0.08em; opacity: 0.9; }
.hud__top .chip { pointer-events: auto; }
.hud__boosters {
  position: absolute; left: 12px; bottom: calc(env(safe-area-inset-bottom) + 2px);
  display: flex; gap: 8px;
  pointer-events: auto;
}
.booster {
  position: relative;
  border: none; cursor: pointer;
  background: rgba(255, 246, 229, 0.94);
  border-radius: 14px;
  width: 52px; height: 52px;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 rgba(120, 84, 40, 0.22);
}
.booster img { width: 30px; height: 30px; }
.booster:active { transform: translateY(2px); }
.booster__count {
  position: absolute; top: -6px; right: -6px;
  background: var(--coral); color: #fff;
  font-size: 11px; font-weight: 900;
  border-radius: 999px;
  min-width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px;
  border: 2px solid #fff;
}

/* ---------- overlays (pause / win / lose) ---------- */
.overlay {
  position: absolute; inset: 0;
  background: rgba(14, 42, 36, 0.62);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 20;
  pointer-events: auto;
  padding: 20px;
}
.overlay__card {
  background: linear-gradient(180deg, var(--cream), var(--cream-2));
  border-radius: 26px;
  padding: 26px 24px;
  width: min(92vw, 360px);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: var(--shadow);
  max-height: 88vh;
  overflow-y: auto;
  text-align: center;
}
.overlay__card h2 { font-size: clamp(24px, 7vw, 32px); color: var(--ink-soft); letter-spacing: 0.04em; }
.overlay__card .btn { width: 100%; }
.win__koko img, .lose__art img { width: clamp(110px, 26vw, 150px); filter: drop-shadow(0 8px 14px rgba(0,0,0,0.2)); }
.win__stars { display: flex; gap: 6px; margin: 2px 0; }
.win__star { width: 44px; height: 44px; animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
.win__star:nth-child(2) { animation-delay: 0.18s; }
.win__star:nth-child(3) { animation-delay: 0.36s; }
@keyframes pop-in { from { transform: scale(0) rotate(-20deg); opacity: 0; } }
.win__coins { display: flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 900; color: var(--ink-soft); }
.win__coins img { width: 26px; height: 26px; }
.win__coins small { font-size: 13px; font-weight: 700; color: #8a6a3d; }
.lose__desc { font-size: 13px; color: #6a4a26; line-height: 1.5; }
.pause__toggles { width: 100%; display: flex; flex-direction: column; gap: 8px; }

/* ---------- toast ---------- */
.toast {
  position: absolute; left: 50%; bottom: 22vh;
  transform: translateX(-50%);
  background: rgba(38, 26, 12, 0.85);
  color: #ffe9b8;
  border-radius: 999px;
  padding: 10px 18px;
  font-weight: 700; font-size: 14px;
  z-index: 30;
  transition: opacity 0.5s ease, transform 0.5s ease;
  white-space: nowrap;
  pointer-events: none;
}
.toast--out { opacity: 0; transform: translateX(-50%) translateY(8px); }

/* ---------- tutorial ---------- */
.tutorial {
  position: absolute; inset: 0;
  background: rgba(14, 42, 36, 0.4);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 25;
  pointer-events: auto;
  padding: 20px;
}
.tutorial__card {
  background: var(--cream);
  border-radius: 22px;
  padding: 18px;
  width: min(92vw, 340px);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  margin-bottom: 8vh;
  box-shadow: var(--shadow);
}
.tutorial__card img { width: 96px; }
.tutorial__card p { font-size: 15px; font-weight: 700; color: var(--ink); text-align: center; line-height: 1.5; }
.tutorial__actions { display: flex; gap: 10px; width: 100%; }
.tutorial__actions .btn { flex: 1; padding: 12px 10px; min-height: 46px; font-size: 14px; }

/* ---------- simulated ad ---------- */
.ad-sim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(10, 20, 26, 0.9);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.ad-sim__card {
  background: linear-gradient(180deg, #17313a, #0f2229);
  border: 3px solid #2f70c8;
  border-radius: 20px;
  width: min(92vw, 380px);
  padding: 22px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: #eaf6fb;
  text-align: center;
}
.ad-sim__badge {
  background: #ffd23f; color: #5c3a1e;
  font-size: 11px; font-weight: 900; letter-spacing: 0.1em;
  border-radius: 6px; padding: 3px 8px;
  align-self: flex-start;
}
.ad-sim__art { margin: 6px 0; }
.ad-sim__title { font-size: 20px; font-weight: 900; }
.ad-sim__note { font-size: 12px; opacity: 0.75; line-height: 1.5; }
.ad-sim__timer { font-size: 14px; opacity: 0.9; }
.ad-sim__card .btn--adclose { margin-top: 4px; }

/* ---------- loading ---------- */
#boot {
  position: fixed; inset: 0; z-index: 99;
  background: linear-gradient(180deg, #2ec4b6, #7fe3d0 60%, #ffe9b8);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  color: #fff; font-weight: 800; letter-spacing: 0.08em;
  transition: opacity 0.4s ease;
}
#boot.done { opacity: 0; pointer-events: none; }
#boot img { width: 110px; animation: bob 2.4s ease-in-out infinite; }
#boot .spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.4); border-top-color: #fff; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- small screens ---------- */
@media (max-width: 480px) {
  .lvl__stars img { width: 14px; height: 14px; }
  .booster { width: 46px; height: 46px; }
  .booster img { width: 26px; height: 26px; }
}

/* landscape phones: shrink vertical paddings */
@media (max-height: 480px) and (orientation: landscape) {
  .menu__logo { margin-top: 2vh; }
  .menu__koko { width: clamp(96px, 18vh, 140px); }
  .menu__title { font-size: clamp(28px, 8vh, 44px); }
  .overlay__card { padding: 16px 18px; gap: 8px; max-height: 92vh; }
}

</style>
</head>
